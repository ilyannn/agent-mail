    <rect x="1.75" y="6.25" width="14.5" height="10" rx="2.25"/>
    <path d="M2.75 7.5 L9 12 L15.25 7.5"/>
    <path d="M9 6.25 V4"/>
  </g>
  <circle cx="9" cy="2.5" r="1.75" fill="#000000"/>
</svg>
